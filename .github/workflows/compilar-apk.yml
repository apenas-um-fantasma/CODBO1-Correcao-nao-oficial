# Compila o APK do BO1-Ascension-ARM64 no GitHub Actions.
# Salve este arquivo no repositório como: .github/workflows/compilar-apk.yml
# Para rodar: aba Actions > "Compilar APK" > Run workflow.
#
# Atenção: o projeto usa um compilador (clang 21) remendado, que precisa ser construído do zero.
# Isso é lento. Por isso há duas tarefas: a primeira constrói o compilador e guarda o resultado no
# armazenamento temporário (cache); a segunda usa esse compilador para gerar o APK.
name: Compilar APK

on:
  workflow_dispatch:

env:
  JOBS: 4

jobs:
  compilador:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Preparar pasta /bo1
        run: |
          sudo mkdir -p /bo1
          sudo chown -R "$USER":"$USER" /bo1
          cp -r "$GITHUB_WORKSPACE" /bo1/src

      - name: Recuperar compilador guardado (se existir)
        id: guardado
        uses: actions/cache@v4
        with:
          path: |
            /bo1/llvm/build/bin
            /bo1/llvm/build/lib/clang
          key: clang21-${{ hashFiles('tools/p32/*.patch', 'tools/native/build-llvm.sh') }}

      - name: Corrigir o ambiente do projeto (falta a ferramenta patch)
        if: steps.guardado.outputs.cache-hit != 'true'
        run: |
          sed -i 's/ git cmake / git patch cmake /' tools/native/docker/Dockerfile
          grep -n "git patch cmake" tools/native/docker/Dockerfile

      - name: Montar o ambiente de compilação (Docker)
        if: steps.guardado.outputs.cache-hit != 'true'
        run: docker build -t bo1-build tools/native/docker

      - name: Construir o compilador remendado (demora horas)
        if: steps.guardado.outputs.cache-hit != 'true'
        run: |
          docker run --rm -e JOBS=$JOBS -v /bo1:/bo1 bo1-build bash /bo1/src/tools/native/build-llvm.sh

      - name: Guardar registros do compilador (para diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registros-compilador
          path: |
            /bo1/llvm/configure.log
            /bo1/llvm/build.log
          if-no-files-found: ignore

  apk:
    needs: compilador
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Preparar pasta /bo1
        run: |
          sudo mkdir -p /bo1
          sudo chown -R "$USER":"$USER" /bo1
          cp -r "$GITHUB_WORKSPACE" /bo1/src

      - name: Recuperar o compilador guardado
        uses: actions/cache/restore@v4
        with:
          path: |
            /bo1/llvm/build/bin
            /bo1/llvm/build/lib/clang
          key: clang21-${{ hashFiles('tools/p32/*.patch', 'tools/native/build-llvm.sh') }}
          fail-on-cache-miss: true

      - name: Corrigir o ambiente do projeto (falta a ferramenta patch)
        run: |
          sed -i 's/ git cmake / git patch cmake /' tools/native/docker/Dockerfile
          grep -n "git patch cmake" tools/native/docker/Dockerfile

      - name: Montar o ambiente de compilação (Docker)
        run: docker build -t bo1-build tools/native/docker

      - name: Compilar o motor e empacotar o APK
        run: |
          cat > /bo1/passos-apk.sh <<'PASSOS'
          set -e
          S=/bo1/src/tools/native
          bash $S/get-ndk.sh
          [ -x /bo1/llvm/build/bin/clang ] || { echo "Compilador remendado não encontrado"; exit 1; }
          bash $S/android-setup.sh
          bash $S/build-dxvk.sh linux
          bash $S/build-ffmpeg.sh linux
          bash $S/build-ffmpeg.sh arm64-v8a
          bash $S/build-p32.sh
          bash $S/build-android.sh
          bash $S/build-dxvk.sh arm64-v8a
          bash $S/build-apk.sh
          PASSOS
          docker run --rm -e JOBS=$JOBS -v /bo1:/bo1 bo1-build bash /bo1/passos-apk.sh

      - name: Guardar registros de compilação (para diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registros-compilacao
          path: |
            /bo1/p32tree/build/android/build.log
            /bo1/p32tree/build/x64/build.log
          if-no-files-found: ignore

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: bo1-apk
          path: /bo1/android/out/*.apk
          if-no-files-found: error
